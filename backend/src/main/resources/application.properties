spring.application.name=parcialFinal

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:parcial}
spring.datasource.username=${POSTGRES_USER:parcial}
spring.datasource.password=${POSTGRES_PASSWORD:parcial}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
app.cache.notas-ttl-segundos=300

management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-components=always
management.metrics.distribution.percentiles-histogram.http.server.requests=true
