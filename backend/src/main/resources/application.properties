spring.application.name=parcialFinal

# Lee variables locales de un archivo .env en el directorio de ejecución (si existe)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:parcial}
spring.datasource.username=${POSTGRES_USER:parcial}
spring.datasource.password=${POSTGRES_PASSWORD:parcial}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
app.cache.notas-ttl-segundos=300

# --- Observabilidad ---
# Endpoints de Actuator publicados por HTTP; /actuator/prometheus lo recoge Prometheus
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-components=always
# Etiqueta común en todas las métricas para distinguir la aplicación en Grafana
management.metrics.tags.application=${spring.application.name}
# Histogramas de latencia HTTP (permiten calcular percentiles p95/p99 en Prometheus)
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Publica las métricas de hilos de Tomcat (panel "Utilisation" del dashboard)
server.tomcat.mbeanregistry.enabled=true

# Credenciales del usuario con el que Prometheus lee /actuator/prometheus
# Prometheus las toma del mismo backend/.env (ver compose.yaml en la raíz)
metrics.user=${METRICS_USER:prometheus-local}
metrics.password=${METRICS_PASSWORD}

# --- Documentación OpenAPI / Swagger UI (pública) ---
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.default-produces-media-type=application/json
